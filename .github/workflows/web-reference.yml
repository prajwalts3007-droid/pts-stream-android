name: Deployed web reference audit
on:
  push:
    branches: [main]
    paths: ['.github/scripts/web-reference.cjs', '.github/workflows/web-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Generate rights-cleared browser playback fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=320x180:rate=15 -t 30 -an -c:v libx264 -preset ultrafast -crf 32 -pix_fmt yuv420p -movflags +faststart /tmp/pts-web-fixture.mp4
      - name: Capture deployed web with synthetic intercepted APIs only
        run: node .github/scripts/web-reference.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-reference-evidence
          path: web-reference/
