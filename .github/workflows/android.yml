name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code for private signed validation
        required: true
        default: '15'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pts-stream-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Validate signed APK without publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          PTS_KEYSTORE_B64: ${{ secrets.PTS_KEYSTORE_B64 }}
          PTS_KEYSTORE_FILE: ${{ runner.temp }}/pts-release.jks
          PTS_KEYSTORE_PASSWORD: ${{ secrets.PTS_KEYSTORE_PASSWORD }}
          PTS_KEY_ALIAS: ${{ secrets.PTS_KEY_ALIAS }}
          PTS_KEY_PASSWORD: ${{ secrets.PTS_KEY_PASSWORD }}
          PTS_VALIDATION_VERSION: ${{ inputs.version_code }}
        run: |
          test -n "$PTS_KEYSTORE_B64" && test -n "$PTS_KEYSTORE_PASSWORD" || { echo 'Signing secrets missing'; exit 1; }
          printf %s "$PTS_KEYSTORE_B64" | base64 -d > "$PTS_KEYSTORE_FILE"
          [[ "$PTS_VALIDATION_VERSION" =~ ^[1-9][0-9]*$ ]] || { echo 'A numeric version is required'; exit 1; }
          gradle --no-daemon :app:assembleRelease -PptsVersionCode="$PTS_VALIDATION_VERSION"
          python3 infra/verify_release_apk.py app/build/outputs/apk/release/app-release.apk --version "$PTS_VALIDATION_VERSION" --output app/build/reports/release-packaging.json
          echo 'Release APK signature verified'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: optimized-release-validation
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/
            app/build/reports/release-packaging.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate signing setup
        env:
          PTS_KEYSTORE_B64: ${{ secrets.PTS_KEYSTORE_B64 }}
          PTS_KEYSTORE_PASSWORD: ${{ secrets.PTS_KEYSTORE_PASSWORD }}
          PTS_KEY_ALIAS: ${{ secrets.PTS_KEY_ALIAS }}
          PTS_KEY_PASSWORD: ${{ secrets.PTS_KEY_PASSWORD }}
        run: |
          test -n "$PTS_KEYSTORE_B64" && test -n "$PTS_KEYSTORE_PASSWORD" && test -n "$PTS_KEY_ALIAS" && test -n "$PTS_KEY_PASSWORD" || { echo 'A persistent release signing key is required'; exit 1; }
          printf %s "$PTS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pts-release.jks"
          chmod 600 "$RUNNER_TEMP/pts-release.jks"
      - name: Build signed release
        env:
          PTS_KEYSTORE_FILE: ${{ runner.temp }}/pts-release.jks
          PTS_KEYSTORE_PASSWORD: ${{ secrets.PTS_KEYSTORE_PASSWORD }}
          PTS_KEY_ALIAS: ${{ secrets.PTS_KEY_ALIAS }}
          PTS_KEY_PASSWORD: ${{ secrets.PTS_KEY_PASSWORD }}
        run: |
          code="${GITHUB_REF_NAME#v}"
          code="${code%%-*}"
          [[ "$code" =~ ^[1-9][0-9]*$ ]] || { echo 'Use numeric tags such as v2'; exit 1; }
          gradle --no-daemon :app:assembleRelease -PptsVersionCode="$code"
          python3 infra/verify_release_apk.py app/build/outputs/apk/release/app-release.apk --version "$code" --output app/build/reports/release-packaging.json
          mv app/build/outputs/apk/release/app-release.apk PTS-Stream-v"$code".apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-optimization-evidence
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/release-packaging.json
      - uses: softprops/action-gh-release@v2
        with:
          files: PTS-Stream-v*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
