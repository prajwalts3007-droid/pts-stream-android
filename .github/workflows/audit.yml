name: Native build and non-emulator audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build app, compile device regressions, run host tests and lint (no emulator)
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Test isolated companion service and LAN relay
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s infra -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-host-audit-evidence
          path: |
            app/build/reports/
            app/build/test-results/
