# Include inside the existing HTTPS server, ahead of its generic /api/ route.
# Define at http scope: limit_conn_zone $binary_remote_addr zone=pts_native_clients:1m;
location ^~ /api/v1/native/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn pts_native_clients 8;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
